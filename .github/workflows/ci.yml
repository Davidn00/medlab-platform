name: MedLab Platform CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop


jobs:

  test:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: medlab_test
          POSTGRES_USER: medlab_user
          POSTGRES_PASSWORD: medlab_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready
          -U medlab_user
          -d medlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Configure database
        run: |
          echo "DATABASE_URL=postgresql+psycopg://medlab_user:medlab_password@localhost:5432/medlab_test" >> $GITHUB_ENV


      - name: Run migrations
        run: |
          alembic upgrade head


      - name: Run tests
        run: |
          pytest -v