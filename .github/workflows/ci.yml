# David Project

name: MedLab Platform CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff check
        run: |
          ruff check .

      - name: Ruff format check
        run: |
          ruff format --check .

      - name: Bandit security scan
        run: |
          bandit -r app -x tests


  test:
    name: Tests
    runs-on: ubuntu-latest

    env:
      APP_NAME: MedLab Platform
      APP_VERSION: 1.0.0
      ENVIRONMENT: testing

      SECRET_KEY: ci-test-secret-key-change-this-value-123456789

      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      JWT_ISSUER: medlab-platform

      ENABLE_DOCS: true

      ALLOWED_HOSTS: localhost,127.0.0.1

      CORS_ORIGINS: http://localhost:3000

      LOGIN_RATE_LIMIT: 5
      LOGIN_RATE_WINDOW_SECONDS: 60

      DATABASE_URL: postgresql+psycopg://medlab_user:medlab_password@localhost:5432/medlab_test

      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 0

      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

      ADMIN_EMAIL: admin@medlab.com
      ADMIN_PASSWORD: Admin123!SecurePassword
      ADMIN_FULL_NAME: Administrador MedLab

      CELERY_TASK_MAX_RETRIES: 5
      CELERY_TASK_RETRY_BACKOFF: 10
      CELERY_TASK_RETRY_BACKOFF_MAX: 300
      CELERY_TASK_RETRY_JITTER: true

    services:

      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: medlab_test
          POSTGRES_USER: medlab_user
          POSTGRES_PASSWORD: medlab_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U medlab_user -d medlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10


      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          alembic upgrade head
      
      - name: Start Celery worker
        run: |
          celery -A app.workers.celery_app.celery_app worker \
            --loglevel=warning \
            --pool=solo \
            > celery.log 2>&1 &

          echo $! > celery.pid

          echo "Waiting for Celery worker..."

          for i in {1..15}; do
            if celery -A app.workers.celery_app.celery_app inspect ping --timeout=2 2>/dev/null | grep -q "pong"; then
              echo "Celery worker is ready."
              break
            fi

            echo "Celery worker not ready yet. Attempt $i/15..."
            sleep 2
          done

          if ! celery -A app.workers.celery_app.celery_app inspect ping --timeout=2 2>/dev/null | grep -q "pong"; then
            echo "Celery worker failed to start."
            echo "===== Celery log ====="
            cat celery.log
            exit 1
          fi
    
      - name: Run tests
        run: |
          pytest


  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    needs:
      - quality
      - test

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker image name
        run: |
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Commit: ${GITHUB_SHA}"
          echo "IMAGE: ghcr.io/davidn00/medlab-platform"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ghcr.io/davidn00/medlab-platform:${{ github.sha }}
            ghcr.io/davidn00/medlab-platform:latest