[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

ignore = [
    "E501",
    "B008",
    "UP042",
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
"app/workers/celery_app.py" = [
    "E402",
    "F401",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"